name: Dry-run cleanup of codegen.py note-button bug

# One-off, read-only: for the 8 recordings the audit flagged, runs the real
# strip_note_markers over each stored codegen.py and prints which lines it
# WOULD remove. Writes nothing. Typed values (.fill args) are redacted since
# these logs are visible to anyone with repo access.
on:
  workflow_dispatch:

jobs:
  dryrun:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install azure-storage-blob playwright

      - name: Dry run
        env:
          ATLAS_AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.ATLAS_AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          python3 <<'PYEOF'
          import importlib.util, os, re, sys
          from azure.storage.blob import BlobServiceClient

          # load the module by path so the capture package __init__ (heavier deps) isn't imported
          spec = importlib.util.spec_from_file_location("cg", "engine/src/atlas_engine/capture/codegen.py")
          cg = importlib.util.module_from_spec(spec); sys.modules["cg"] = cg; spec.loader.exec_module(cg)

          IDS = """051c2a19-df71-4129-99a9-88b929b5d216 1309a784-49a1-427b-b05f-a34872ecc03d
          3b251fee-457c-4ba3-a2c9-85edbe46f63e 79298dae-aad6-4083-9c6e-11b6bf8d6813
          7968a5df-5e08-4866-88e3-21c849cc4dba 8b2ee98e-8289-4b34-9868-4a9fdf908269
          98049365-28e4-4692-9e48-f474e254fafb bb0867dc-97d1-4fe2-ae78-ee4e6f868453""".split()

          def redact(line):
              return re.sub(r'\.(fill|type|press_sequentially)\((.*)\)', r'.\1(<redacted>)', line)

          c = BlobServiceClient.from_connection_string(os.environ["ATLAS_AZURE_STORAGE_CONNECTION_STRING"]).get_container_client("atlas-runs")
          for rid in IDS:
              name = f"recordings/{rid}/codegen.py"
              original = c.download_blob(name).readall().decode("utf-8", errors="replace")
              cleaned = cg.strip_note_markers(original)
              orig_lines, kept = original.splitlines(), set()
              # walk both in order to mark which original lines survived
              cl = cleaned.splitlines(); j = 0
              for i, line in enumerate(orig_lines):
                  if j < len(cl) and cl[j] == line:
                      kept.add(i); j += 1
                  elif j < len(cl) and cl[j] == "# __ATLAS_NOTE__":
                      j += 1
              removed = [i for i in range(len(orig_lines)) if i not in kept]
              before = len(cg.parse_codegen_actions(original))
              after = len(cg.parse_codegen_actions(cleaned))
              print(f"\n=== {rid}  lines {len(orig_lines)} -> {len(cl)}  replay actions {before} -> {after}")
              for i in removed:
                  print(f"  - L{i+1:<3} {redact(orig_lines[i]).strip()}")
              nxt = max(removed) + 1 if removed else None
              if nxt is not None and nxt < len(orig_lines):
                  print(f"  (next kept) L{nxt+1:<3} {redact(orig_lines[nxt]).strip()}")
          PYEOF
