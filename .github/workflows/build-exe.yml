name: Build desktop exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "engine/src/**"
      - "frontend/src/**"
      - ".github/workflows/build-exe.yml"

jobs:
  migrate-production:
    # Applies pending Alembic migrations to the real production database
    # before the exe is even built -- as its own job (mirrors EVmodule's
    # deploy.yml/deployment.yml build -> migrate -> deploy job graph), not a
    # step inside build-windows-exe: migrating first means a migration
    # failure never wastes a slow Windows build, and the two have no real
    # dependency on each other anyway -- the desktop exe (desktop/app.py)
    # connects straight to prod Postgres with no migration step of its own,
    # so a packaged build with new model fields could run against a schema
    # that was never migrated (confirmed: prod `atlas` sat one revision
    # behind, missing recording_folders, with no migration step anywhere
    # until this one).
    #
    # Deliberately NOT part of ci.yml / gated on its tests: those are flaky
    # enough right now to fail often for reasons unrelated to a given
    # change, and blocking a migration + build on a flaky, unrelated test
    # run just delays shipping for no safety benefit. Testing and shipping
    # are separate concerns.
    name: Migrate production database
    runs-on: ubuntu-latest
    environment: production
    env:
      ATLAS_DATABASE_URL: ${{ secrets.ATLAS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine
        working-directory: engine
        run: pip install -e .
      - name: Run migrations against production
        working-directory: engine
        run: alembic upgrade head
      - name: Verify production is at head
        # Belt-and-suspenders: `upgrade head` already fails loudly on error,
        # but this confirms the DB actually landed exactly on the revision
        # this checkout defines as head -- not a stale branch, not multiple
        # heads.
        working-directory: engine
        run: |
          CURRENT=$(alembic current | head -1 | cut -d' ' -f1)
          HEAD=$(alembic heads | head -1 | cut -d' ' -f1)
          echo "current=$CURRENT head=$HEAD"
          if [ "$CURRENT" != "$HEAD" ]; then
            echo "::error::Production is at $CURRENT, expected head $HEAD"
            exit 1
          fi

  build-windows-exe:
    needs: [migrate-production]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      ATLAS_DATABASE_URL: ${{ secrets.ATLAS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install engine
        working-directory: engine
        run: pip install -e ".[dev]"

      - name: Install desktop packaging deps
        run: pip install -r desktop/requirements-desktop.txt

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Vendors Chromium inside the playwright package (PLAYWRIGHT_BROWSERS_PATH=0)
      # instead of the OS-level cache, so the built exe doesn't depend on the
      # machine running it already having Chromium installed. Moved aside
      # before the PyInstaller build and copied back into the frozen bundle
      # afterward — PyInstaller's binary-processing step can't handle a
      # vendored browser's nested app-bundle structure directly in the build
      # (see desktop/build.sh, the equivalent local/macOS build script, for
      # the full explanation).
      - name: Vendor Chromium inside the playwright package
        shell: bash
        run: PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium

      - name: Move the vendored browser aside for a clean build
        shell: bash
        run: |
          pkg_dir=$(python -c "import playwright, os; print(os.path.dirname(playwright.__file__))")
          echo "PLAYWRIGHT_PKG_DIR=$pkg_dir" >> "$GITHUB_ENV"
          mv "$pkg_dir/driver/package/.local-browsers" "$RUNNER_TEMP/local-browsers"

      - name: Write baked-in production credentials
        shell: bash
        # This exe talks directly to production Postgres and Blob Storage —
        # no deployed backend in between — so the credentials it needs at
        # runtime are baked into the bundle at build time instead of being
        # supplied by whoever runs it. Written from repo secrets, never
        # committed (desktop/production.env is gitignored).
        run: |
          cat > desktop/production.env <<EOF
          ATLAS_DATABASE_URL=${{ secrets.ATLAS_DATABASE_URL }}
          ATLAS_SESSION_SECRET=${{ secrets.ATLAS_SESSION_SECRET }}
          ATLAS_AZURE_STORAGE_CONNECTION_STRING=${{ secrets.ATLAS_AZURE_STORAGE_CONNECTION_STRING }}
          ATLAS_AZURE_STORAGE_CONTAINER=atlas-runs
          ATLAS_REQUIRE_AZURE_STORAGE=true
          EOF

      - name: Build desktop exe
        shell: bash
        run: |
          rm -rf build dist atlas-desktop.spec
          pyinstaller --onedir --windowed --name atlas-desktop --add-data "frontend/dist;frontend_dist" --add-data "desktop/production.env;." --paths engine/src desktop/app.py

      - name: Copy the vendored browser into the frozen bundle
        shell: bash
        run: cp -R "$RUNNER_TEMP/local-browsers" "dist/atlas-desktop/_internal/playwright/driver/package/.local-browsers"

      - name: Zip distribution folder
        shell: bash
        run: |
          cd dist
          7z a atlas-desktop-windows.zip atlas-desktop

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-windows dist/atlas-desktop-windows.zip --title "Latest Windows Build" --notes "Automated Windows build with vendored Chromium" || gh release upload latest-windows dist/atlas-desktop-windows.zip --clobber

      - name: Upload exe artifact (optional fallback)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: atlas-desktop-windows
          path: dist/atlas-desktop/
          include-hidden-files: true
