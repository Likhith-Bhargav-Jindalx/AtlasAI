name: Build desktop exe

on:
  workflow_dispatch:
  # Was `push: branches: [main]` with its own path filter. Switched to
  # workflow_run so this exe build can never land ahead of CI's
  # migrate-production job -- the exe talks straight to prod Postgres with
  # no migration step of its own (see ci.yml's migrate-production job), so
  # a build produced in parallel with (or before) a pending migration could
  # ship new model fields a not-yet-migrated prod schema doesn't have. A
  # `push`-triggered workflow in a separate file runs concurrently with
  # `ci.yml`'s own `push` trigger, not after it -- only workflow_run
  # actually waits for the other workflow's conclusion.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  check-paths:
    # workflow_run has no equivalent of push.paths, so this reimplements
    # that filter by diffing the commit CI just ran against its parent --
    # an unrelated change (docs, test-only, etc.) still skips the Windows
    # build instead of rebuilding on every merge to main. Compares against
    # HEAD^ specifically (not the push's original `before` SHA, which
    # workflow_run's payload doesn't carry) -- correct for the common case
    # of one commit landing on main per merge; a multi-commit push could
    # under-detect a relevant change further back than the immediate parent.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - id: diff
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE '^(desktop/|engine/src/|frontend/src/|\.github/workflows/build-exe\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows-exe:
    needs: [check-paths]
    # always() is required because workflow_dispatch skips check-paths
    # entirely (its own `if` only matches workflow_run) -- without it, this
    # job would inherit that skip via `needs` instead of evaluating its own
    # condition.
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && needs.check-paths.outputs.relevant == 'true'))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install engine
        working-directory: engine
        run: pip install -e ".[dev]"

      - name: Install desktop packaging deps
        run: pip install -r desktop/requirements-desktop.txt

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Vendors Chromium inside the playwright package (PLAYWRIGHT_BROWSERS_PATH=0)
      # instead of the OS-level cache, so the built exe doesn't depend on the
      # machine running it already having Chromium installed. Moved aside
      # before the PyInstaller build and copied back into the frozen bundle
      # afterward — PyInstaller's binary-processing step can't handle a
      # vendored browser's nested app-bundle structure directly in the build
      # (see desktop/build.sh, the equivalent local/macOS build script, for
      # the full explanation).
      - name: Vendor Chromium inside the playwright package
        shell: bash
        run: PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium

      - name: Move the vendored browser aside for a clean build
        shell: bash
        run: |
          pkg_dir=$(python -c "import playwright, os; print(os.path.dirname(playwright.__file__))")
          echo "PLAYWRIGHT_PKG_DIR=$pkg_dir" >> "$GITHUB_ENV"
          mv "$pkg_dir/driver/package/.local-browsers" "$RUNNER_TEMP/local-browsers"

      - name: Write baked-in production credentials
        shell: bash
        # This exe talks directly to production Postgres and Blob Storage —
        # no deployed backend in between — so the credentials it needs at
        # runtime are baked into the bundle at build time instead of being
        # supplied by whoever runs it. Written from repo secrets, never
        # committed (desktop/production.env is gitignored).
        run: |
          cat > desktop/production.env <<EOF
          ATLAS_DATABASE_URL=${{ secrets.ATLAS_DATABASE_URL }}
          ATLAS_SESSION_SECRET=${{ secrets.ATLAS_SESSION_SECRET }}
          ATLAS_AZURE_STORAGE_CONNECTION_STRING=${{ secrets.ATLAS_AZURE_STORAGE_CONNECTION_STRING }}
          ATLAS_AZURE_STORAGE_CONTAINER=atlas-runs
          ATLAS_REQUIRE_AZURE_STORAGE=true
          EOF

      - name: Build desktop exe
        shell: bash
        run: |
          rm -rf build dist atlas-desktop.spec
          pyinstaller --onedir --windowed --name atlas-desktop --add-data "frontend/dist;frontend_dist" --add-data "desktop/production.env;." --paths engine/src desktop/app.py

      - name: Copy the vendored browser into the frozen bundle
        shell: bash
        run: cp -R "$RUNNER_TEMP/local-browsers" "dist/atlas-desktop/_internal/playwright/driver/package/.local-browsers"

      - name: Zip distribution folder
        shell: bash
        run: |
          cd dist
          7z a atlas-desktop-windows.zip atlas-desktop

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-windows dist/atlas-desktop-windows.zip --title "Latest Windows Build" --notes "Automated Windows build with vendored Chromium" || gh release upload latest-windows dist/atlas-desktop-windows.zip --clobber

      - name: Upload exe artifact (optional fallback)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: atlas-desktop-windows
          path: dist/atlas-desktop/
          include-hidden-files: true
