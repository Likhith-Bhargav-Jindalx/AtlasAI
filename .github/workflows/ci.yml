name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_password
          POSTGRES_DB: atlas_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas_dev_password@localhost:5434/atlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine
        working-directory: engine
        run: pip install -e ".[dev]"
      - name: Install Playwright Chromium
        working-directory: engine
        run: python -m playwright install --with-deps chromium
      - name: Run migrations
        working-directory: engine
        run: alembic upgrade head
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run tests
        working-directory: engine
        # Several tests exercise the real headed-browser recording path
        # (headless=False is deliberate there — an agent watches their own
        # actions while recording) — ubuntu-latest has no display server by
        # default, so xvfb-run provides a virtual one.
        run: xvfb-run -a pytest -v

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm test
