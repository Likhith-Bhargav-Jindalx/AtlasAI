name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest runners have 4 cores, so -n auto alone tops out
        # around a 4x speedup regardless of test count — splitting into
        # separate matrix JOBS multiplies that by however many shards run
        # concurrently (each gets its own isolated 4-core runner + Postgres
        # service), instead of everything fighting over one runner's cores.
        # pytest-split divides tests using engine/.test_durations (recorded
        # via `pytest --store-durations`) so groups are balanced by actual
        # runtime, not just test count -- the heavy real-browser/certify
        # tests don't all land in one shard.
        group: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_password
          POSTGRES_DB: atlas_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas_dev_password@localhost:5434/atlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine
        working-directory: engine
        run: pip install -e ".[dev]"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('engine/pyproject.toml') }}
      - name: Install Playwright Chromium
        working-directory: engine
        run: python -m playwright install --with-deps chromium
      - name: Run migrations
        working-directory: engine
        run: alembic upgrade head
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run tests
        working-directory: engine
        # Several tests exercise the real headed-browser recording path
        # (headless=False is deliberate there — an agent watches their own
        # actions while recording) — ubuntu-latest has no display server by
        # default, so xvfb-run provides a virtual one. -n auto (pytest-xdist)
        # parallelizes across this runner's own cores on top of the
        # --splits/--group sharding above; the fixture portal server binds
        # an OS-assigned port specifically so each worker's own instance
        # doesn't collide with the others.
        run: xvfb-run -a pytest --splits 4 --group ${{ matrix.group }} -n auto -v

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm test
