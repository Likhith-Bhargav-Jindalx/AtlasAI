[project]
name = "atlas-engine"
version = "0.1.0"
description = "Atlas AI capture/trajectory/brain/codegen/certify engine"
requires-python = ">=3.11"
dependencies = [
    # <1.64: atlas_engine.capture.codegen.attach_codegen_recorder calls Playwright's
    # private "enableRecorder" channel directly, which 1.64.0 removed (last verified
    # working at 1.63.0). Bump this ceiling only after that call is ported to
    # whatever replaced it.
    "playwright>=1.49,<1.64",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "click>=8.1",
    "httpx>=0.27",
    "bcrypt>=4.0",
    "azure-storage-blob>=12.19",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "pytest-split>=0.10",
]

[project.scripts]
atlas = "atlas_engine.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
