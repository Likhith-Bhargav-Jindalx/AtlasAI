[project]
name = "atlas-engine"
version = "0.1.0"
description = "Atlas AI capture/trajectory/brain/codegen/certify engine"
requires-python = ">=3.11"
dependencies = [
    # Deliberately unconstrained above 1.49, including into 1.64+ (which removed
    # the private "enableRecorder" channel attach_codegen_recorder calls): that
    # channel's own native recorder UI (a separate Inspector window, and an
    # in-page toolbar that can swallow real clicks near the top of the page --
    # confirmed via a live recording) made pinning back down to keep it alive
    # worse than losing the native codegen script. attach_codegen_recorder's
    # own try/except absorbs the resulting failure; codegen_script is simply
    # None until that call is ported to whatever replaced the channel.
    "playwright>=1.49",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "click>=8.1",
    "httpx>=0.27",
    "bcrypt>=4.0",
    "azure-storage-blob>=12.19",
    "python-multipart>=0.0.12",
    "sentry-sdk>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "pytest-split>=0.10",
]

[project.scripts]
atlas = "atlas_engine.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
