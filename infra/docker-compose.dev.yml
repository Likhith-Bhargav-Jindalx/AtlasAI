services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_password
      POSTGRES_DB: atlas
    ports:
      - "5434:5432"
    volumes:
      - atlas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local, free emulator for Azure Blob Storage — lets AzureBlobRunStore be
  # exercised in dev/tests with zero real Azure account or cost. Its
  # connection string below is Microsoft's own published well-known test
  # key (not a secret — see Azurite's docs), valid only against this local
  # emulator.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: "azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck"
    ports:
      - "10000:10000"

volumes:
  atlas_pg_data:
